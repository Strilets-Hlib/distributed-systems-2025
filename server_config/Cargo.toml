[package]
name = "server-config"
version = "0.1.0"
edition = "2021"

[dependencies]
http_reader = {path = "../http_reader"}

http = "1.3.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
reqwest = { version = "0.12.15", features = ["blocking"] }
uuid = {version = "1.16.0", features = ["v4"]}
rand = "0.9.1"
clap = { version = "4.5.40", features = ["derive"] }
toml = "0.8.23"
